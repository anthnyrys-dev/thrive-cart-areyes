services:
  app:
    build:
      args:
        user: anthony
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: thrivecart
    container_name: thrivecart-app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - thrivecart

  nginx:
    image: nginx:alpine
    container_name: thrivecart-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx:/etc/nginx/conf.d
    networks:
      - thrivecart

networks:
  thrivecart:
    driver: bridge
